<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero demo · LinearB AI assistant block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* LinearB current brand. Single light theme by choice, matching linearb.io and brand.html. */
:root{
  color-scheme:light;
  /* every colour is a LinearB brand hex (linearb-brand v3) */
  --ground:#ffffff;
  --pane:#f3f5fa;        /* Slate 100 */
  --pane-2:#f3f5fa;      /* Slate 100 */
  --rule:#dde3ef;        /* Slate 200 */
  --dim:#617284;         /* Slate 500 */
  --slate:#4d5865;       /* Slate 600 */
  --ink:#222326;         /* Slate 800 */
  --aqua:#c3f1f5;        /* Teal 200 */
  --aqua-2:#9feaed;      /* Teal 300 */
  --teal:#10b9d0;        /* Teal 500 */
  --indigo:#5b66fb;      /* Indigo 500 */
  --indigo-2:#7c85fc;    /* Indigo 400 */
  --indigo-6:#414cb2;    /* Indigo 600: small indigo text on white */
  --lav:#dde1ff;         /* Indigo 200 */
  --lav-2:#f6f7ff;       /* Indigo 100 */
  --coral:#ff6445;       /* Red 500 */
  --coral-soft:#fee0df;  /* Red 200 */
  --red-6:#d75241;       /* Red 600: small red text on white */
  --good:#079f5a;        /* Green 600 */
  --night:#222326;       /* Slate 800, the dark band */
  --night-2:#373e46;     /* Slate 700 */
  --night-rule:#4d5865;  /* Slate 600 */
  --night-text:#ffffff;
  --night-dim:#bac3d3;   /* Slate 300: copy on dark */
  --display:"Outfit","Helvetica Neue",system-ui,sans-serif;
  --sans:"Roboto","Helvetica Neue",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(34,35,38,.04),0 12px 32px rgba(34,35,38,.07);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--slate);font:18px/26px var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:0;color:var(--ink);margin:0;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* mono and display text sit at zero tracking; only body copy carries -1% */
.fb,.sql,.wcode,.chart text,.tile .t-val,.callouts b,.ev-stat,.ch-t{letter-spacing:0}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:20px}
.logo{display:flex;align-items:center;text-decoration:none;color:var(--ink)}
.logo svg{width:118px;height:auto;display:block}
.nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0;font-size:15px;color:var(--ink)}
.nav ul a{text-decoration:none}
.nav ul a:hover{color:var(--indigo-6)}
.nav ul a[aria-current]{color:var(--indigo-6)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px/24px var(--display);letter-spacing:0;text-decoration:none;border-radius:40px;padding:12px 24px;border:2px solid var(--ink);background:none;color:var(--ink);transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn.solid{background:var(--ink);color:#fff}
/* every variant fades to Indigo 500 on hover */
.btn:hover{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px clamp(24px,4vw,64px);align-items:start;padding-block:clamp(32px,5vw,64px) clamp(28px,3vw,40px)}
h1{font-weight:600;font-size:clamp(40px,5.2vw,64px);line-height:1.125}
h1 em{font-style:normal;color:var(--indigo)}
h1 .ln{display:block}
@media (min-width:640px){h1.fit .ln{white-space:nowrap}}
.sub{margin:0;padding-top:.4em;font-size:18px;line-height:26px;max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* stage: the dashboard and the assistant on the aqua panel */
.stage-wrap{padding-bottom:clamp(36px,4vw,52px)}
.lstrip{padding-block:0 64px}
@media (max-width:1165px){.lstrip{padding-bottom:32px}}
.lstrip p{margin:0 0 20px;text-align:center;font:700 14px/20px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.marquee{display:flex;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.lstrip .logos{list-style:none;margin:0;padding:0 88px 0 0;display:flex;align-items:center;gap:88px;flex:0 0 auto;animation:marq 60s linear infinite}
.marquee:hover .logos{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-100%)}}
.lstrip .logos li{flex:0 0 auto}
.lstrip img{display:block;width:auto;height:auto;max-height:30px;max-width:150px;opacity:.5;transition:opacity .2s}
.lstrip li:hover img{opacity:.9}
@media (max-width:900px){.lstrip .logos{gap:56px;padding-right:56px}}
@media (max-width:640px){.lstrip img{max-height:24px;max-width:110px}}
@media (prefers-reduced-motion:reduce){.lstrip .logos{animation:none}.marquee{flex-wrap:wrap;justify-content:center;-webkit-mask-image:none;mask-image:none}.marquee .logos[aria-hidden]{display:none}.lstrip .logos{flex-wrap:wrap;justify-content:center;gap:24px 48px;padding:0}}
.aqua{background:var(--aqua);border-radius:24px;padding:clamp(10px,1.6vw,18px);display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:clamp(10px,1.4vw,16px)}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);min-width:0}
.board{padding:18px;display:flex;flex-direction:column;gap:14px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.board-h h2{font-size:17px;font-weight:600}
.board-h span{font-size:12.5px;color:var(--dim)}
.tiles{flex:1;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:10px}
.tile{text-align:left;background:var(--ground);border:2px solid var(--rule);border-radius:16px;padding:14px 16px 14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px;transition:border-color .15s,box-shadow .15s,background .15s}
.tile{position:relative}
.tile:hover{border-color:var(--indigo-2)}
.tiles.auto .tile[aria-pressed=true]::after{content:"";position:absolute;left:18px;right:18px;bottom:7px;height:2px;border-radius:2px;background:var(--indigo);opacity:.55;transform-origin:left;animation:tfill var(--dwell) linear both}
@keyframes tfill{from{transform:scaleX(0)}}
.tile[aria-pressed=true]{border-color:var(--indigo);box-shadow:0 0 0 3px var(--lav)}
.tile .t-main{display:grid;gap:3px;min-width:0}
.tile .t-name{font:400 13.5px/1.3 var(--sans);color:var(--slate)}
.tile .t-line{display:grid;gap:2px}
.tile .t-val{font:600 34px/1.1 var(--display);color:var(--ink)}
.tile .t-val small{font-size:.62em;font-weight:600;color:inherit;margin-left:1px;letter-spacing:0}
.tile .t-delta{font-size:13px;color:var(--dim)}
.tile .t-delta b{font-weight:700;color:var(--red-6)}
.tile .ask{border-radius:999px;padding:10px 14px 10px 16px;background:var(--lav-2);color:var(--indigo-6);font:400 13.5px/1.25 var(--sans);display:flex;align-items:center;gap:10px;white-space:nowrap;transition:background .15s}
.tile .ask i{font-style:normal;font-size:15px;transition:transform .15s}
.tile:hover .ask{background:var(--lav)}
.tile:hover .ask i{transform:translateX(3px)}
.tile[aria-pressed=true] .ask{background:var(--indigo);color:#fff}
#hero-ev{grid-column:1/-1;padding:0;overflow:hidden}
#hero-ev>.ev{transition:opacity .22s ease,transform .22s ease}
#hero-ev.out>.ev{opacity:0;transform:translateY(6px)}
#hero-ev .ev{background:#fff;border-radius:16px;padding:22px 28px;min-height:128px;grid-template-columns:auto minmax(0,1fr) auto;column-gap:28px;row-gap:6px;align-content:center;align-items:center}
#hero-ev .ev-h{grid-row:1/span 4;align-self:stretch;min-height:0;padding-right:28px;border-right:1px solid var(--rule);width:172px}
#hero-ev .ev-logo{height:calc(var(--h) * 1.3)!important;max-width:140px}
#hero-ev .ev>:not(.ev-h):not(a){grid-column:2;max-width:64ch}
#hero-ev .ev a{grid-column:3;grid-row:1/span 4;white-space:nowrap}
#hero-ev .ev-stat{font-size:18px;line-height:1.4}
#hero-ev blockquote{font-size:15px}
#hero-ev figcaption{font-size:13px}
@media (max-width:760px){#hero-ev .ev{grid-template-columns:1fr;padding:18px}#hero-ev .ev-h,#hero-ev .ev>:not(.ev-h):not(a),#hero-ev .ev a{grid-column:1;grid-row:auto}#hero-ev .ev-h{border-right:0;padding-right:0;width:auto}}
.asst .chart svg{max-height:190px}

/* assistant panel */
.asst{display:flex;flex-direction:column;height:560px}
.asst-h{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--rule);font:600 14px/1 var(--display);color:var(--ink)}
.asst-h img{width:18px}
.asst-h .mode{margin-left:auto;display:flex;gap:4px;background:var(--pane);border-radius:999px;padding:3px;font:400 12px/1 var(--sans)}
.asst-h .mode span{padding:6px 10px;border-radius:999px;color:var(--dim)}
.asst-h .mode span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(34,35,38,.08)}
.asst-b{flex:1;overflow-y:auto;padding:16px 18px 18px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.composer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.composer{margin:0 14px 14px;border:2px solid var(--rule);border-radius:16px;padding:11px 14px;font-size:13.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
.composer i{font-style:normal;background:var(--pane);border-radius:999px;padding:2px 10px;font-size:12px}

/* an answer, shared by every demo on the page */
.ans{display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.ans>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.ans p{margin:0}
.ans b{font-weight:600}
.ans ul{margin:0;padding-left:18px;display:grid;gap:4px}
.q{align-self:flex-end;max-width:88%;background:var(--pane);border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:14px;color:var(--ink)}
.ran{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.ran svg{width:14px;height:14px;flex:0 0 auto;color:var(--good)}
.ran.busy svg{color:var(--dim);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ch-t{font:600 14px/1.3 var(--display);color:var(--ink);margin:0 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin:0 0 4px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .g line{stroke:var(--rule)}
.chart .ax{fill:var(--dim);font:10.5px var(--sans)}
.chart .vl{fill:var(--ink);font:400 10.5px var(--sans)}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.chart .ln{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .area{opacity:.12}
.hb{display:grid;gap:7px;font-size:12.5px}
.hb .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr 58px;gap:10px;align-items:center}
.hb .l{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;border-radius:5px;background:var(--pane-2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:5px;background:var(--indigo-2);transform-origin:left;animation:growx .6s cubic-bezier(.2,.7,.2,1) both}
.hb .tr i.hi{background:var(--coral)}
.hb .v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
@keyframes growx{from{transform:scaleX(0)}}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.callouts div{border:2px solid var(--rule);border-radius:16px;padding:9px 12px}
.callouts b{display:block;font:600 21px/1.15 var(--display);color:var(--ink)}
.callouts b.hot{color:var(--coral)}
.callouts span{font-size:12px;color:var(--dim)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:700;color:var(--dim);padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
.tbl td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);color:var(--ink)}
.tbl .n{text-align:right;padding-right:0}
.up{color:var(--red-6)}
.down{color:var(--good)}
.prs{display:grid;gap:8px}
.pr{border:2px solid var(--rule);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12.5px}
.pr b{font-weight:700;color:var(--ink);font-size:13px}
.pr .w{grid-row:span 2;align-self:center;text-align:right;font:600 15px/1.2 var(--display);color:var(--ink)}
.pr .w.hot{color:var(--red-6)}
.pr .w small{display:block;font:400 11px var(--sans);color:var(--dim)}
.pr span{color:var(--dim)}
.next{color:var(--slate)}

/* evidence card */
.ev{border-radius:16px;background:var(--lav-2);padding:14px 16px;display:grid;gap:8px;animation-delay:.1s}
.ev-h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:26px}
.ev-logo{display:block;width:auto;max-width:150px}
.ev-org{font:600 18px/1 var(--display);color:var(--ink)}
.ev-stat{font:600 17px/1.35 var(--display);color:var(--ink);margin:0}
.ev blockquote{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.ev figcaption{font-size:12px;color:var(--dim)}
.ev a{font-size:14px;color:var(--indigo-6);text-decoration:none;font-weight:700}
.ev a:hover{text-decoration:underline}

/* sections */
/* brand section rhythm: 128px between sections; two plain sections back to back halve their shared edge */
.sect{padding-block:64px}
.night .sect{padding-block:128px}
.night + .sect{padding-top:128px}
.sect:has(+ .night){padding-bottom:128px}
#start{padding-block:64px}
@media (max-width:1165px){.sect{padding-block:32px}.night .sect{padding-block:64px}.night + .sect{padding-top:64px}.sect:has(+ .night){padding-bottom:64px}#start{padding-block:32px}}
.sect h2{font-weight:600;font-size:clamp(32px,4.2vw,48px);line-height:1.167;max-width:20em}
.lede{margin:20px 0 0;font-size:clamp(18px,1.7vw,20px);line-height:1.4;max-width:60ch;color:var(--slate)}

/* roles, side by side */
.alts{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);align-items:stretch;margin-top:64px}
.chev{display:grid;place-items:center;color:var(--indigo-2)}
.chev svg{width:18px;height:18px}
.alt-card{border:2px solid var(--rule);border-radius:24px;background:#fff;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.alt-card header{display:grid;gap:3px}
.alt-card h3{font-size:18px;line-height:26px}
.scope{margin:0;font-size:14px;line-height:22px;color:var(--dim)}
.ask-in{display:flex;align-items:center;gap:10px;border:2px solid var(--lav);border-radius:16px;padding:9px 9px 9px 12px;background:#fff;font-size:14px;line-height:1.35;color:var(--ink);box-shadow:0 2px 8px rgba(91,102,251,.08)}
.ask-in>svg{width:16px;height:16px;flex:0 0 auto;color:var(--indigo)}
.ask-in span{flex:1;min-width:0}
.ask-in i{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff}
.ask-in i svg{width:14px;height:14px}
.alt-body{display:grid;gap:12px;font-size:14px;line-height:1.55;color:var(--ink);background:var(--pane);border-radius:4px 16px 16px 16px;padding:12px 14px 14px;margin-top:-4px}
.reply-h{display:flex;align-items:center;gap:7px;font:400 12px/1 var(--sans);color:var(--dim)}
.reply-h img{width:15px;height:auto}
.alt-body .pr{background:#fff}
.alt-body .hb .tr{background:#fff}
.alt-body p{margin:0}
.alt-body b{font-weight:600}

/* x-ray */
.xr-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(24px,4vw,56px);align-items:center;margin-top:8px}
.xr-notes{display:grid;gap:18px;margin-top:26px}
.xr-notes div{border-top:1px solid var(--rule);padding-top:14px}
.xr-notes h3{font-size:18px;line-height:26px;margin-bottom:4px}
.xr-notes p{margin:0;font-size:18px;line-height:26px}
.xr{border-radius:24px;box-shadow:var(--shadow);background:#fff;border:2px solid var(--rule);overflow:hidden}
.xr-head{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.xr-head>*{padding:12px 18px;display:flex;align-items:center;gap:9px}
.xh-a{font:600 14px/1.3 var(--display);color:var(--ink)}
.xh-a img{width:18px}
.xh-b{background:var(--lav-2);border-left:2px solid var(--indigo);font:700 14px/20px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--indigo-6)}
.xr-rows{display:grid}
.xr-row{display:grid;grid-template-columns:1fr 1fr}
.xr-row>*{padding:11px 18px;transition:background-color .15s}
.xr-row+.xr-row>*{border-top:1px solid var(--rule)}
.fa{background:#fff;color:var(--ink);font-size:14px;line-height:1.55;display:flex;flex-direction:column;justify-content:center}
.fb{border-left:2px solid var(--indigo);display:flex;flex-direction:column;justify-content:center;background-color:var(--lav-2);background-image:linear-gradient(var(--lav) 1px,transparent 1px),linear-gradient(90deg,var(--lav) 1px,transparent 1px);background-size:18px 18px;font:12.5px/1.6 var(--mono);color:var(--ink)}
.fa p,.fb p{margin:0}
.fb dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:2px 12px}
@media (max-width:640px){.fb dl{grid-template-columns:1fr;gap:0}.fb dt{margin-top:4px}}
.xr .callouts{grid-template-columns:1fr 1fr}
.xr .callouts div{padding:8px 11px}
.xr .callouts b{font-size:19px}
.xr-row:hover .fa{background:var(--lav-2)}
.xr-row:hover .fb{background-color:var(--lav)}
.xr-tog{display:none}
@media (max-width:640px){
  .xr-head{grid-template-columns:1fr}
  .xh-b{background:var(--lav-2);border-left:2px solid var(--indigo);font:700 14px/20px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--indigo-6)}
  .xh-a{flex-wrap:wrap}
  .xr-tog{display:flex;width:100%;margin-top:4px;padding:3px;border-radius:999px;background:var(--pane);gap:3px}
  .xr-tog button{flex:1;border:0;border-radius:999px;padding:8px 10px;background:none;font:400 13px/1 var(--sans);color:var(--dim)}
  .xr-tog button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(34,35,38,.12)}
  .xr-tog button[data-v=fb][aria-pressed=true]{color:var(--indigo-6)}
  .xr-tog button{position:relative;overflow:hidden}
  .xr-tog.auto button[aria-pressed=true]::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:2px;background:var(--indigo);opacity:.55;transform-origin:left;animation:tfill 4s linear both}
  /* both faces share each row's cell, so flipping shows the source exactly where its answer was */
  .xr-row{grid-template-columns:1fr}
  .xr-row>*{grid-area:1/1;transition:opacity .25s ease}
  .fb{border-left:0;opacity:0;pointer-events:none}
  .xr.src .fa{opacity:0;pointer-events:none}
  .xr.src .fb{opacity:1;pointer-events:auto}
}
.fb dt{color:var(--indigo-6);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:1px}
.fb dd{margin:0}
.xr-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:72px;margin-top:6px}
.xr-bars div{display:flex;gap:3px;align-items:end;height:100%}
.xr-bars i{flex:1;border-radius:3px 3px 0 0;background:var(--lav)}
.xr-bars i+i{background:var(--indigo-2)}
.xr-bars i.hi{background:var(--coral)}
.xr-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11px;color:var(--dim);text-align:center;margin-top:4px}

/* builder, the one dark band on the page */
.night{background:var(--night);color:var(--night-dim)}
.night h2{color:#fff}
.night .lede{color:var(--night-dim)}
.b-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px);align-items:start}
.bchips{display:grid;gap:8px;margin-top:28px}
.bchip{text-align:left;border:2px solid var(--night-rule);background:var(--night-2);color:var(--night-text);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.35;display:flex;gap:10px;align-items:center}
.bchip:hover{border-color:var(--indigo-2)}
.bchip[aria-pressed=true]{border-color:var(--indigo-2)}
.bchip svg{width:16px;height:16px;flex:0 0 auto;color:var(--indigo-2)}
.bnote{margin-top:32px;font-size:16px;line-height:24px}
.bwin{background:var(--night-2);border:2px solid var(--night-rule);border-radius:24px;padding:14px;display:grid;gap:12px}
.bprompt{background:var(--night);border:2px solid var(--night-rule);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--night-text);min-height:46px;display:flex;align-items:center;gap:10px}
.bprompt .tag{font:400 11.5px/1 var(--sans);color:#aeb6ff;background:#273168;border-radius:999px;padding:5px 9px;flex:0 0 auto}
.bprompt .txt.typing::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--night-text);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wcard{background:#fff;border-radius:16px;padding:16px 16px 12px;color:var(--ink)}
.wcard{container-type:inline-size}
/* the widget area always holds the tallest state (a line chart with its legend), so nothing below it moves while it builds */
.wstage{height:calc(26px + 46cqw);display:flex;flex-direction:column;justify-content:center}
.wstage>#w-chart{width:100%}
.wstage>.wcode{flex:1;min-height:0;overflow:hidden}
.wcode{margin:0;background:var(--pane);border-radius:16px;padding:12px 14px;font:12px/1.7 var(--mono);color:var(--ink);white-space:pre;overflow:hidden}
.wcode .k{color:#414cb2}.wcode .f{color:#5f32a0}.wcode .s{color:#d75241}.wcode .p{color:#008f9a}
.wcode .cur::after{content:"";display:inline-block;width:7px;height:1.1em;background:var(--indigo);vertical-align:-.2em;margin-left:2px;animation:blink 1s steps(1) infinite}
.bsteps{list-style:none;margin:0;padding:0 4px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--night-dim)}
.bsteps li{display:flex;align-items:center;gap:7px;opacity:.5;transition:opacity .2s,color .2s}
.bsteps li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--night-rule);transition:background .2s}
.bsteps li.on{opacity:1;color:var(--night-text)}
.bsteps li.on::before{background:var(--indigo-2);animation:beat 1s ease-in-out infinite}
.bsteps li.done{opacity:1;color:var(--night-text)}
.bsteps li.done::before{background:#0ad570}
@keyframes beat{50%{transform:scale(1.5)}}
#w-chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
#w-chart.draw .area{animation:fade .7s .6s both}
#w-chart.draw circle{animation:fade .25s both;animation-delay:.95s}
#w-chart.draw .legend,#w-chart.draw .ax{animation:fade .4s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
.bbtn.solid.ready{animation:nudge 1.4s ease-out 1}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.wcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.wcard-h h3{font-size:15px;font-weight:600}
.badge{font:400 11px/1 var(--sans);border-radius:999px;padding:5px 9px;background:var(--pane);color:var(--dim)}
.badge.new{background:var(--indigo);color:#fff}
.bfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.bfoot .sp{flex:1}
.bbtn{border:2px solid var(--night-rule);background:none;color:var(--night-text);border-radius:40px;padding:8px 16px;font:600 14px/20px var(--display);transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.bbtn:hover{background:var(--indigo);border-color:var(--indigo);color:#fff}
.bbtn.solid{background:#fff;color:var(--ink);border-color:#fff}
.bbtn.solid:hover{background:var(--indigo);border-color:var(--indigo);color:#fff}
.bbtn:disabled{opacity:.6;cursor:default}
.sql{margin:0;background:var(--night);border:2px solid var(--night-rule);border-radius:16px;padding:12px 14px;font:12px/1.65 var(--mono);color:var(--night-text);overflow-x:auto;white-space:pre}
.sql .k{color:#aeb6ff}.sql .f{color:#c3a4f4}.sql .s{color:#f7b9b7}.sql .p{color:#9feaed}

/* mcp band */
.mcp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--pane);border-radius:24px;padding:clamp(24px,3.5vw,44px)}
.mcp h2{font-size:clamp(26px,3vw,32px);line-height:1.25}
.mcp p{margin:10px 0 0;max-width:40em}
.clients{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.clients span{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:7px 13px 7px 11px;font-size:13.5px;color:var(--ink)}
.clients svg{width:16px;height:16px;flex:0 0 auto;fill:currentColor}
.clients svg[fill="none"]{fill:none}

/* faq + close */
.faq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,4vw,56px)}
.faq details{border-top:1px solid var(--rule)}
.faq details:last-child{border-bottom:1px solid var(--rule)}
.faq summary{cursor:pointer;list-style:none;padding:18px 36px 18px 0;position:relative;font:600 18px/26px var(--display);color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:15px;font-size:22px;color:var(--dim)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{margin:0 0 18px;max-width:42em}
.close{background:var(--aqua);border-radius:24px;padding:clamp(32px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.close h2{font-size:clamp(32px,4.2vw,48px);line-height:1.167}
.close .ctas{margin:0}
.foot{padding-block:28px 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;line-height:22px;color:var(--dim)}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr}
}
@media (max-width:980px){
  .aqua{grid-template-columns:1fr}
  /* stacked: the answer panel keeps one height and scrolls inside, so nothing below it moves */
  .asst{height:min(560px,78vh)}
  /* the metrics become one swipeable row right above the answer */
  .board{gap:12px;padding:16px 0 14px}
  .board-h{padding-inline:16px}
  .tiles{display:flex;grid-template-columns:none;grid-auto-rows:auto;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:4px 16px 6px;gap:10px;scrollbar-width:none;flex:none}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:0 0 min(300px,80%);scroll-snap-align:start}
  .alts{grid-template-columns:1fr}
  .chev{height:28px}
  .chev svg{transform:rotate(90deg)}
  .xr-grid,.b-grid,.faq{grid-template-columns:1fr}
}
@media (max-width:860px){
  .nav ul{display:none}
  .hero{grid-template-columns:1fr}
  .mcp{grid-template-columns:1fr}
}
@media (max-width:640px){
  .asst-h .mode{display:none}
  .chart .ax{font-size:15px}
  .chart .vl{font-size:15px}
  #hero-ev .ev-stat{font-size:16px}
  #hero-ev .ev-logo{height:calc(var(--h) * 1.1)!important}
  .tile{grid-template-columns:1fr;row-gap:10px;padding:12px 14px}
  .tile .t-val{font-size:28px}
  .tile .ask{white-space:normal;justify-content:space-between}
    .hb .r{grid-template-columns:minmax(80px,40%) 1fr 50px}
}
@media (max-width:420px){
  .tiles{gap:8px}
  }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.blk-pad{padding-block:48px}

</style>
</head>

/* ---------- charts ---------- */
function step(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function nice(max){ const s = step(max / 4); return { top: Math.ceil(max / s) * s, s }; }
function grouped(labels, a, b, hi, unit = 'h', names = ['Last month', 'This month']){
  const W = 420, H = 200, L = 32, B = 24, T = 16, { top, s } = nice(Math.max(...a, ...b)), n = labels.length;
  const Y = v => T + (H - T - B) * (1 - v / top), cw = (W - L) / n, bw = Math.min(26, cw * .3);
  let g = '';
  for(let v = 0; v <= top + 1e-9; v += s) g += `<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${+v.toFixed(1)}${unit}</text>`;
  const bars = labels.map((l, i) => { const cx = L + cw * i + cw / 2, x1 = cx - bw - 2, x2 = cx + 2;
    return `<rect class="bar" x="${x1}" y="${Y(a[i])}" width="${bw}" height="${Y(0) - Y(a[i])}" rx="3" fill="${C.lav}" style="animation-delay:${i * 50}ms"><title>${esc(l)}, ${names[0].toLowerCase()}: ${a[i]}${unit}</title></rect>`
      + `<rect class="bar" x="${x2}" y="${Y(b[i])}" width="${bw}" height="${Y(0) - Y(b[i])}" rx="3" fill="${i === hi ? C.coral : C.ind2}" style="animation-delay:${i * 50 + 25}ms"><title>${esc(l)}, ${names[1].toLowerCase()}: ${b[i]}${unit}</title></rect>`
      + `<text class="vl" x="${x2 + bw / 2}" y="${Y(b[i]) - 5}" text-anchor="middle">${b[i]}</text>`
      + `<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; }).join('');
  return `<div class="legend"><span style="--c:${C.lav}">${names[0]}</span><span style="--c:${C.ind2}">${names[1]}</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grouped bar chart"><g class="g">${g}</g>${bars}</svg></div>`;
}
function lines(xl, series, { pre = '', unit = '', W = 420, min = 0, max, step } = {}){
  const auto = nice(Math.max(...series.flatMap(x => x.v))), top = max ?? auto.top, s = step ?? auto.s, lo = min;
  const H = W * .46, L = 38, R = 12, B = 24, T = 14, n = xl.length;
  const X = i => L + (W - L - R) * i / (n - 1), Y = v => T + (H - T - B) * (1 - (v - lo) / (top - lo));
  let g = '';
  for(let v = lo; v <= top + 1e-9; v += s) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${pre}${+v.toFixed(0)}${unit}</text>`;
  const xs = xl.map((l, i) => (n <= 8 || i % 2 === 0 || i === n - 1) ? `<text class="ax" x="${X(i)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(l)}</text>` : '').join('');
  const ps = series.map(se => { const pts = se.v.map((v, i) => [X(i), Y(v)]), d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const area = series.length === 1 ? `<path class="area" d="${d} L${X(n - 1)},${Y(lo)} L${X(0)},${Y(lo)} Z" fill="${se.c}"/>` : '';
    const last = pts[n - 1];
    return area + `<path class="ln" d="${d}" stroke="${se.c}" pathLength="1"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 4 : 2.4}" fill="${se.c}"><title>${esc(xl[i])}, ${esc(se.name)}: ${pre}${se.v[i]}${unit}</title></circle>`).join('')
      + (series.length === 1 ? `<text class="vl" x="${last[0] - 8}" y="${last[1] - 10}" text-anchor="end">${pre}${se.v[n - 1]}${unit}</text>` : ''); }).join('');
  const lg = series.length > 1 ? `<div class="legend">${series.map(se => `<span style="--c:${se.c}">${esc(se.name)}</span>`).join('')}</div>` : '';
  return lg + `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart"><g class="g">${g}</g>${xs}${ps}</svg></div>`;
}
const hbars = (rows, max, fmt = v => v) => `<div class="hb">${rows.map(([l, v, hi], i) => `<div class="r"><span class="l" title="${esc(l)}">${esc(l)}</span><span class="tr"><i class="${hi ? 'hi' : ''}" style="width:${(v / max * 100).toFixed(1)}%;animation-delay:${i * 50}ms"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`;
const table = (head, rows, num = []) => `<table class="tbl"><thead><tr>${head.map((h, i) => `<th${num.includes(i) ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${num.includes(i) ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const callouts = items => `<div class="callouts">${items.map(([b, s, hot]) => `<div><b class="${hot ? 'hot' : ''}">${b}</b><span>${s}</span></div>`).join('')}</div>`;
const title = t => `<p class="ch-t">${t}</p>`;

/* ---------- render an answer, optionally streamed ---------- */
const runs = new WeakMap();
async function swapEv(box, html){
  if(reduce){ box.innerHTML = html; return; }
  box.classList.add('out'); await new Promise(r => setTimeout(r, 220));
  const h0 = box.offsetHeight;
  box.innerHTML = html;
  const h1 = box.offsetHeight;
  requestAnimationFrame(() => box.classList.remove('out'));
  if(h0 && h0 !== h1 && box.animate) box.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 320, easing: 'cubic-bezier(.3,.7,.2,1)' });
}
async function show(box, key, animate, evBox){
  const id = (runs.get(box) || 0) + 1; runs.set(box, id);
  const a = A[key], live = () => runs.get(box) === id;
  const wrap = document.createElement('div'); wrap.className = 'ans';
  wrap.innerHTML = `<p class="q">${esc(a.q)}</p><p class="ran${animate ? ' busy' : ''}">${animate ? SPIN : CK}<span>${animate ? 'Finding the widget that answers this…' : esc(a.ran)}</span></p>`;
  box.replaceChildren(wrap); box.scrollTop = 0;
  const parts = evBox ? a.blocks : [...a.blocks, evidence(a.ev)];
  if(evBox && !animate) evBox.innerHTML = evidence(a.ev);
  if(!animate){ wrap.insertAdjacentHTML('beforeend', parts.join('')); wrap.querySelectorAll(':scope>*').forEach(el => el.style.animation = 'none'); wrap.querySelectorAll('.bar,.hb i').forEach(el => el.style.animation = 'none'); return; }
  await sleep(750); if(!live()) return;
  const ran = wrap.querySelector('.ran'); ran.classList.remove('busy'); ran.innerHTML = `${CK}<span>${esc(a.ran)}</span>`;
  for(const html of parts){ await sleep(240); if(!live()) return; wrap.insertAdjacentHTML('beforeend', html); }
  if(evBox){ await sleep(150); if(live()) swapEv(evBox, evidence(a.ev)); }
}

function stopTour(){ touring = false; clearTimeout(tourT); tilesEl.classList.remove('auto'); }
function runTour(){

['pointerenter', 'focusin', 'keydown'].forEach(ev => stage.addEventListener(ev, stopTour));

{

/* ---------- builder ---------- */
/* Builder: runs only when its markup is on the page, so each block also works on its own */
if(document.querySelector('.bwin')){
const BUILD = [
  { p:'Review time for agent PRs vs human PRs, by week', t:'Review time: agent vs human PRs', rows:'8 rows · 128ms',
    draw: () => lines(['Jul 26','Aug 2','Aug 9','Aug 16','Aug 23','Aug 30','Sep 6','Sep 13'], [{ name:'Agent PRs', v:[18,22,27,31,36,41,47,52], c:C.ind }, { name:'Human PRs', v:[14,15,13,15,14,16,15,14], c:C.coral }], { unit:'h' }),
    sql:`SELECT
  toStartOfWeek(time) AS week,

  avgIf(review_hours, author_type = 'human') AS human_prs
FROM v_pr_reviews_v1
WHERE time >= {start_date:Date}

ORDER BY week ASC` },
  { p:'PRs merged per week, split by AI tool', t:'PRs merged by AI tool', rows:'24 rows · 96ms',
    draw: () => lines(['Jul 26','Aug 2','Aug 9','Aug 16','Aug 23','Aug 30','Sep 6','Sep 13'], [{ name:'Claude Code', v:[42,51,58,66,71,80,88,97], c:C.ind }, { name:'Cursor', v:[38,40,44,43,47,49,52,51], c:C.teal }, { name:'Copilot', v:[30,31,29,32,30,33,31,32], c:C.coral }]),
    sql:`SELECT

  { p:'Rework rate by team, this quarter vs last', t:'Rework rate by team', rows:'8 rows · 81ms',

    sql:`SELECT

FROM v_raw_metrics_v1
WHERE time >= {start_date:Date}

const hl = s => esc(s).replace(/'[^']*'/g, m => `<span class="s">${m}</span>`).replace(/\{[a-z_]+:Date\}/g, m => `<span class="p">${m}</span>`)
  .replace(/\b(SELECT|FROM|WHERE|AND|GROUP BY|ORDER BY|AS|ASC|DESC)\b/g, '<span class="k">$1</span>').replace(/\b(toStartOfWeek|toStartOfQuarter|avgIf|sumIf|count|round)\(/g, '<span class="f">$1</span>(');
const PLUS = "<svg aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 14 14\"><g><path stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 0.5H1.5c-0.552285 0 -1 0.447715 -1 1V5c0 0.55228 0.447715 1 1 1H5c0.55228 0 1 -0.44772 1 -1V1.5c0 -0.552285 -0.44772 -1 -1 -1Z\" stroke-width=\"1\"></path><path stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12.5 8H9c-0.55228 0 -1 0.44772 -1 1v3.5c0 0.5523 0.44772 1 1 1h3.5c0.5523 0 1 -0.4477 1 -1V9c0 -0.55228 -0.4477 -1 -1 -1Z\" stroke-width=\"1\"></path><path stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 8H1.5c-0.552285 0 -1 0.44772 -1 1v3.5c0 0.5523 0.447715 1 1 1H5c0.55228 0 1 -0.4477 1 -1V9c0 -0.55228 -0.44772 -1 -1 -1Z\" stroke-width=\"1\"></path><path stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m10.75 6 0 -5.5\" stroke-width=\"1\"></path><path stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8 3.25h5.5\" stroke-width=\"1\"></path></g></svg>";
const bchips = $('#bchips'), bp = $('#bp'), wSave = $('#w-save'), wSql = $('#w-sql'), wQ = $('#w-q');
bchips.innerHTML = BUILD.map((b, i) => `<button type="button" class="bchip" data-i="${i}" aria-pressed="${i === 0}">${PLUS}<span>${esc(b.p)}</span></button>`).join('');
let bRun = 0, bCur = 0;
const steps = [...document.querySelectorAll('#bsteps li')], wCode = $('#w-code'), wChart = $('#w-chart');
const setStep = n => steps.forEach((li, k) => { li.className = k < n ? 'done' : k === n ? 'on' : ''; });
function paint(i, animate){
  const b = BUILD[i]; $('#w-title').textContent = b.t; wCode.hidden = true;
  wChart.classList.toggle('draw', !!animate && !reduce); wChart.innerHTML = b.draw(); wChart.hidden = false;
  wSql.innerHTML = hl(b.sql); $('#w-rows').textContent = b.rows;
  $('#w-badge').textContent = 'Preview'; $('#w-badge').className = 'badge';
  wSave.disabled = false; wSave.textContent = 'Save to dashboard';
  wSave.classList.remove('ready'); if(animate){ void wSave.offsetWidth; wSave.classList.add('ready'); }
}
async function build(i){
  const id = ++bRun, b = BUILD[i], live = () => id === bRun; bCur = i;
  bchips.querySelectorAll('.bchip').forEach(x => x.setAttribute('aria-pressed', +x.dataset.i === i));
  setStep(-1); wSave.disabled = true; wSave.classList.remove('ready'); wSql.hidden = true; wQ.textContent = 'View query'; wQ.setAttribute('aria-expanded', 'false');
  $('#w-title').textContent = 'Untitled widget'; $('#w-badge').textContent = 'Draft'; $('#w-badge').className = 'badge'; $('#w-rows').textContent = '';
  wChart.hidden = true; wCode.hidden = false; wCode.innerHTML = '';
  bp.classList.add('typing'); bp.textContent = '';
  for(let k = 1; k <= b.p.length; k++){ if(!live()) return; bp.textContent = b.p.slice(0, k); await sleep(16); }
  bp.classList.remove('typing'); await sleep(250); if(!live()) return;

}

});

}

})();
