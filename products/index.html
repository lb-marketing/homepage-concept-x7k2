<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Product pages (internal drafts)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Roboto:wght@400;500&display=swap">
<style>
/* Index of the product page concepts. Add a line to the list for each new page folder. */
:root{
  --ground:#ffffff;
  --rule:#dde3ef;   /* Slate 200 */
  --dim:#617284;    /* Slate 500 */
  --ink:#222326;    /* Slate 800 */
  --indigo:#5b66fb; /* Indigo 500 */
  --display:"Outfit","Helvetica Neue",system-ui,sans-serif;
  --sans:"Roboto","Helvetica Neue",system-ui,sans-serif;
}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);letter-spacing:-.01em}
main{max-width:720px;margin:0 auto;padding:64px 16px}
h1{font:600 32px/1.2 var(--display);letter-spacing:0;margin:0 0 8px}
p{color:var(--dim);margin:0 0 32px}
ul{list-style:none;margin:0;padding:0;border-top:2px solid var(--rule)}
li{border-bottom:2px solid var(--rule)}
a{display:block;padding:20px 0;color:inherit;text-decoration:none}
a strong{display:block;font:600 20px/1.3 var(--display);letter-spacing:0}
a span{color:var(--dim)}
a:hover strong,a:focus-visible strong{color:var(--indigo)}
</style>
<main>
  <h1>Product pages</h1>
  <p>Internal drafts. Each page lives in its own folder here. The homepage concept is at <a href="../brand.html" style="display:inline;padding:0;color:var(--indigo)">brand.html</a>.</p>
  <ul>
    <li><a href="ai-assistant/"><strong>Ask LinearB</strong><span>The AI assistant</span></a></li>
  </ul>
</main>
</html>
